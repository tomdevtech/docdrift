# Generated by `docdrift init` — see the README for all options.
repo_name: "docdrift"

api_base_url: "http://127.0.0.1:1234/v1"
model: "qwen3.5-4b-super-coder"

max_prompt_chars: 92000           # LM Studio context: 92k tokens
mode: "both"                          # both | overview (only the HLA note _Architecture.md) | per-file

obsidian:
  access_mode: "local"
  vault_path: "Your path"
  rest_api_base_url: ""
  rest_api_key: "${OBSIDIAN_REST_API_KEY}"

github_docs:
  enabled: true
  precheck: true
  engine: "llm"                   # copilot | llm (no Copilot licence needed)
  llm_api_base_url: "https://openrouter.ai/api/v1"
  llm_model: "openrouter/free"    # or pin a "<vendor>/<model>:free" model
  assignee: "copilot"
  docs_paths:
    - "docs/"
    - "README.md"

ignore:
  - "tests/"
  - "docs/"
  - "*.md"
  - "*.lock"
  - ".docdrift/*"
